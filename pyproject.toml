[project]
name = "qa-mcp-server"
version = "0.1.0"
description = "MCP server that exposes allowlisted Android QA tools (adb) to AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Nagawo", email = "gabrielnagawo12@gmail.com" }]
keywords = ["mcp", "android", "adb", "qa", "test-automation", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.12,<2",
    "pydantic>=2.7,<3",
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "anyio>=4.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[project.scripts]
qa-mcp-server = "qa_mcp_server.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit
    "C4",  # comprehensions
    "SIM", # simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
    "PTH", # pathlib
    "TID", # tidy imports
    "N",   # naming
]
ignore = [
    "S603", # subprocess call: argv lists are built by typed builders and gated by the allowlist
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S604", "S607"]
"examples/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=qa_mcp_server --cov-report=term-missing --cov-fail-under=80"
markers = [
    "security(category): case in the security test matrix (injection, traversal, policy, ...)",
    "live: needs a real Android device or a live LLM; skipped by default",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["qa_mcp_server"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "examples"]
